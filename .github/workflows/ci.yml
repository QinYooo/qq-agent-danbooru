name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-web.txt
      - run: python -B -m unittest discover -s tests -p "test_*.py" -v
      - name: Check browser JavaScript
        run: node --check web/static/app.js
      - name: Test preview, folder drop and pagination
        run: node --test tests/interaction.test.cjs
      - name: Test QQ modules when present
        shell: bash
        run: |
          if [ -d plugins ]; then
            node --test --test-timeout=10000 tests/*.test.mjs
          fi
      - name: Install into a fresh Windows environment
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $parameters = @{
            RuntimeDir = Join-Path $env:RUNNER_TEMP 'danbooru-runtime'
            LibraryPath = Join-Path $env:RUNNER_TEMP 'danbooru-library'
            BrowseOnly = $true
            SkipDownloads = $true
            NoLaunch = $true
            NoShortcut = $true
          }
          if (Test-Path plugins) {
            $agent = Join-Path $env:RUNNER_TEMP 'QQ Agent'
            New-Item -ItemType Directory -Force -Path "$agent/resources/app/plugins","$agent/resources/app/src" | Out-Null
            Set-Content "$agent/resources/app/src/plugin-loader.js" '// isolated installer fixture'
            $parameters.QQAgentDir = $agent
          }
          .\install.ps1 @parameters
          if ($LASTEXITCODE -ne 0) { throw 'Fresh installation failed.' }
          $config = Get-Content config.json -Raw | ConvertFrom-Json
          & $config.python -B -c "import sys; sys.path.insert(0, 'web'); from runtime_config import load_config; from store import Store; assert Store(load_config()).stats()['total'] == 0; print('Fresh library ready')"
          if ($LASTEXITCODE -ne 0) { throw 'Installed environment startup failed.' }
