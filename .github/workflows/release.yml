name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag
        required: true
        default: v1.1.0
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-web.txt
      - run: python -B -m unittest discover -s tests -p "test_*.py" -v
      - name: Verify JavaScript
        shell: bash
        run: |
          node --check web/static/app.js
          node --test tests/interaction.test.cjs
          if [ -d plugins ]; then node --test --test-timeout=10000 tests/*.test.mjs; fi
      - name: Build source distribution
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: python tools/build_release.py "$RELEASE_TAG"
      - name: Publish ZIP and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        shell: bash
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "$RELEASE_TAG" --notes-file RELEASE_NOTES.md
          fi
          gh release upload "$RELEASE_TAG" dist/*.zip dist/SHA256SUMS.txt --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest
